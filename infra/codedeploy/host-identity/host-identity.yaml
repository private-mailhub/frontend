AWSTemplateFormatVersion: '2010-09-09'
Description: Optional dedicated EC2 role and instance profile. No permission policies or host association.

Rules:
  ProductionRegion:
    Assertions:
      - Assert: {'Fn::Equals': [{Ref: 'AWS::Region'}, us-east-1]}
        AssertDescription: This stack can be created or updated only in us-east-1.

Resources:
  HostRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole

  HostProfile:
    Type: AWS::IAM::InstanceProfile
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Roles: [{Ref: HostRole}]

Outputs:
  InstanceRoleName: {Value: {Ref: HostRole}}
  InstanceProfileName: {Value: {Ref: HostProfile}}
