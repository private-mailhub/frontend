name: Deploy frontend

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mailhub-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Deployment is intentionally manual and disabled until this repository variable is set.
    if: ${{ github.ref == 'refs/heads/main' && vars.CODEDEPLOY_ENABLED == 'true' }}
    environment: production
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
      CODEDEPLOY_APP: ${{ vars.CODEDEPLOY_APP }}
      CODEDEPLOY_GROUP: ${{ vars.CODEDEPLOY_GROUP }}
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate deployment configuration
        run: |
          set -Eeuo pipefail
          : "${AWS_REGION:?AWS_REGION is required}"
          : "${AWS_ROLE_ARN:?AWS_ROLE_ARN is required}"
          : "${DEPLOY_BUCKET:?DEPLOY_BUCKET is required}"
          : "${CODEDEPLOY_APP:?CODEDEPLOY_APP is required}"
          : "${CODEDEPLOY_GROUP:?CODEDEPLOY_GROUP is required}"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate production build does not expose encryption keys
        run: bash test/production-build.sh

      - name: Build production frontend
        run: VITE_API_URL=https://private-mailhub.com npm run build:prod

      - name: Package CodeDeploy revision
        run: |
          set -Eeuo pipefail
          bundle="$RUNNER_TEMP/mailhub-frontend-${GITHUB_SHA}.zip"
          deploy/package-frontend.sh "$GITHUB_SHA" "$bundle"
          printf 'REVISION_BUNDLE=%s\n' "$bundle" >> "$GITHUB_ENV"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload immutable revision to S3
        id: upload
        run: |
          set -Eeuo pipefail
          revision_key="frontend/${GITHUB_SHA}/mailhub-frontend-${GITHUB_SHA}.zip"
          version_id="$(aws s3api put-object \
            --bucket "$DEPLOY_BUCKET" \
            --key "$revision_key" \
            --body "$REVISION_BUNDLE" \
            --query VersionId \
            --output text)"
          [[ -n "$version_id" && "$version_id" != 'None' ]]
          printf 'key=%s\n' "$revision_key" >> "$GITHUB_OUTPUT"
          printf 'version_id=%s\n' "$version_id" >> "$GITHUB_OUTPUT"

      - name: Create CodeDeploy deployment
        id: deployment
        env:
          REVISION_KEY: ${{ steps.upload.outputs.key }}
          REVISION_VERSION: ${{ steps.upload.outputs.version_id }}
        run: |
          set -Eeuo pipefail
          deployment_id="$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --s3-location "bucket=$DEPLOY_BUCKET,key=$REVISION_KEY,bundleType=zip,version=$REVISION_VERSION" \
            --query deploymentId \
            --output text)"
          [[ -n "$deployment_id" && "$deployment_id" != 'None' ]]
          printf 'id=%s\n' "$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for CodeDeploy success
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        run: aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"

      - name: Verify HTTPS homepage
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors https://private-mailhub.com/
